<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant:ital@1&display=swap" rel="stylesheet">
<style>html body{margin:0;min-height:100vh;background:#160d24 radial-gradient(circle at 50% 30%,#3d1f5c,#160d24 70%);font-family:Cormorant,serif;color:#f1e3c3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;box-sizing:border-box}
h1{font:700 clamp(24px,5vw,44px) 'Cinzel Decorative',serif;margin:0;color:#e6c27a;text-align:center}
.row{display:flex;gap:min(3vw,24px);perspective:1200px}.card{width:min(27vw,180px);aspect-ratio:2/3.3;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.card.f{transform:rotateY(180deg)}.fa{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid #e6c27a;box-sizing:border-box}
.bk{background:#2a1846 repeating-conic-gradient(from 45deg,#e6c27a22 0 10deg,#0000 10deg 20deg);box-shadow:inset 0 0 0 8px #2a1846,inset 0 0 0 9px #e6c27a}
.bk:after{content:'☾';position:absolute;inset:0;display:grid;place-items:center;font-size:48px;color:#e6c27a}
.fr{transform:rotateY(180deg);background:linear-gradient(#f6ecd4,#e8d6ad);color:#2a1846;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 6px;text-align:center}
.fr .n{font:700 clamp(9px,1.6vw,13px) 'Cinzel Decorative',serif}.fr .s{font-size:clamp(40px,8vw,70px);line-height:1}.fr .m{font-style:italic;font-size:clamp(11px,1.8vw,15px)}
.pos{text-align:center;font-size:14px;letter-spacing:.3em;margin-top:8px;opacity:.7}.r{font-size:clamp(16px,2.6vw,22px);font-style:italic;max-width:36em;text-align:center;min-height:2em}
button{font:700 14px 'Cinzel Decorative',serif;background:none;color:#e6c27a;border:1px solid #e6c27a;padding:10px 22px;border-radius:30px;cursor:pointer}</style></head><body>
<h1>Past · Present · Future</h1><div class="row" id="row"></div><div class="r" id="r">Touch each card to turn it.</div><button onclick="deal()">Shuffle the deck</button>
<script>
const D=[['The Fool','☄','a leap without a net'],['The Magician','✦','you already have the tools'],['The Moon','☾','not everything is as it seems'],['The Sun','☀','warmth, clarity, a yes'],['The Star','✧','hope after the storm'],['The Tower','♜','what breaks makes room'],['The Lovers','♡','a choice of the heart'],['Wheel of Fortune','☸','the cycle turns'],['The Hermit','☖','answers come in silence'],['Strength','♌','gentle hands tame lions'],['Death','✝','an ending, finally'],['The World','◎','a circle closes']];
function deal(){const row=document.getElementById('row');row.innerHTML='';const p=[...D].sort(()=>Math.random()-.5).slice(0,3);document.getElementById('r').textContent='Touch each card to turn it.';
p.forEach((d,i)=>{const w=document.createElement('div');w.innerHTML=`<div class="card"><div class="fa bk"></div><div class="fa fr"><div class="n">${d[0]}</div><div class="s">${d[1]}</div><div class="m">${d[2]}</div></div></div><div class="pos">${['PAST','PRESENT','FUTURE'][i]}</div>`;
w.firstChild.onclick=e=>{e.currentTarget.classList.add('f');document.getElementById('r').textContent=`${['In your past','Right now','Ahead of you'][i]}: ${d[0]} — ${d[2]}.`};row.appendChild(w)})}deal();
</script></body></html>
