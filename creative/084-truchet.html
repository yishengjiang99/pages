<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Truchet</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@900&display=swap" rel="stylesheet">
<style>html body{margin:0;min-height:100vh;background:#0d3b66;font-family:'Red Hat Display',sans-serif}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));min-height:100vh}#g div{aspect-ratio:1;cursor:pointer;transition:transform .35s cubic-bezier(.5,1.6,.4,1)}
#g svg{width:100%;height:100%;display:block}.t{position:fixed;bottom:20px;right:20px;background:#faf0ca;color:#0d3b66;padding:10px 18px;font-size:clamp(18px,3vw,30px);border-radius:40px;box-shadow:0 8px 0 #f4d35e;cursor:pointer}</style></head><body>
<div id="g"></div><div class="t" onclick="pal()">TRUCHET ↻</div>
<script>
const P=[['#0d3b66','#faf0ca','#f95738'],['#1b1b1b','#f2f2f2','#ff2e63'],['#2b2d42','#edf2f4','#ef233c'],['#264653','#e9c46a','#2a9d8f'],['#3d0066','#ffd6ff','#ff70a6']];let p=P[0];
const g=document.getElementById('g');function tile(){return`<svg viewBox="0 0 60 60"><rect width="60" height="60" fill="var(--bg)"/><path d="M30 0A30 30 0 0 1 0 30M60 30A30 30 0 0 0 30 60" fill="none" stroke="var(--fg)" stroke-width="12"/><path d="M30 0A30 30 0 0 1 0 30M60 30A30 30 0 0 0 30 60" fill="none" stroke="var(--ac)" stroke-width="3"/></svg>`}
function fill(){g.innerHTML='';const n=Math.ceil(innerWidth/60)*Math.ceil(innerHeight/60)+20;for(let i=0;i<n;i++){const d=document.createElement('div');d.innerHTML=tile();let r=Math.random()<.5?0:90;d.style.transform=`rotate(${r}deg)`;d.onpointerenter=d.onclick=()=>{r+=90;d.style.transform=`rotate(${r}deg)`};g.appendChild(d)}}
function pal(){p=P[(P.indexOf(p)+1)%P.length];document.body.style.setProperty('--bg',p[0]);document.body.style.setProperty('--fg',p[1]);document.body.style.setProperty('--ac',p[2]);document.body.style.background=p[0]}
pal();pal();fill();addEventListener('resize',fill);
</script></body></html>
