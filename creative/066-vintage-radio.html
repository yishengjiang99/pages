<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Philco 1938</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Courier+Prime&display=swap" rel="stylesheet">
<style>html body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2d4a43 repeating-linear-gradient(90deg,#2d4a43 0 6px,#2a463f 6px 12px);font-family:'Courier Prime',monospace}
.r{width:min(92vw,520px);aspect-ratio:1.15;border-radius:46% 46% 14px 14px/56% 56% 14px 14px;background:linear-gradient(90deg,#4a2511,#8a4a22 20%,#a65d2c 50%,#8a4a22 80%,#4a2511);box-shadow:0 30px 60px #0007,inset 0 4px 10px #fff3;position:relative;padding:12% 10% 6%;box-sizing:border-box;display:flex;flex-direction:column;gap:6%}
.gr{flex:1;border-radius:46% 46% 8px 8px/60% 60% 8px 8px;background:#2a1a10 repeating-linear-gradient(90deg,#d8b98a 0 3px,#0000 3px 12px);box-shadow:inset 0 0 30px #000;position:relative}
.gr:after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(#0000 40%,#000a)}
.dial{height:22%;background:linear-gradient(#f6e2b4,#e3c88c);border-radius:8px;position:relative;box-shadow:inset 0 0 12px #8a6a2a,0 0 0 4px #c9a253;overflow:hidden}
.dial.on{background:linear-gradient(#ffe9a8,#ffcf6e);box-shadow:inset 0 0 12px #8a6a2a,0 0 0 4px #c9a253,0 0 30px #ffcf6e}
.sc{position:absolute;inset:8px 12px;display:flex;justify-content:space-between;font-size:clamp(9px,2vw,12px);color:#5a3a12}.nd{position:absolute;top:4px;bottom:4px;width:2px;background:#b3261e;left:50%;transition:left .1s}
.k{display:flex;justify-content:space-between;padding:0 6%}.kn{width:clamp(44px,12vw,64px);aspect-ratio:1;border-radius:50%;background:conic-gradient(#3a1a08,#7a4a22,#3a1a08,#7a4a22,#3a1a08);box-shadow:0 6px 10px #0006,inset 0 0 0 6px #5a2a10;cursor:grab;touch-action:none;position:relative}
.kn:after{content:'';position:absolute;top:8%;left:50%;width:3px;height:30%;background:#e3c88c;margin-left:-1.5px}
.st{color:#f6e2b4;text-align:center;margin-top:20px;font-size:14px;min-height:1.2em;letter-spacing:.1em}h1{font:clamp(18px,4vw,28px) 'Abril Fatface',serif;color:#e3c88c;text-align:center;margin:0 0 10px}</style></head><body>
<div><h1>The Philco Model 38</h1><div class="r"><div class="gr"></div><div class="dial" id="dl"><div class="sc"><span>55</span><span>70</span><span>90</span><span>110</span><span>130</span><span>160</span></div><div class="nd" id="nd"></div></div>
<div class="k"><div class="kn" id="pw" title="power"></div><div class="kn" id="tu" title="tune"></div></div></div><div class="st" id="st">CLICK LEFT KNOB FOR POWER · DRAG RIGHT KNOB TO TUNE</div></div>
<script>
let ac,on=false,f=.5,noise,ng,tone,tg,lfo;const S=[[.2,'WXYZ · Swing Hour',261.6],[.47,'KDKA · News of the World',196],[.78,'WLW · Moonlight Serenade',329.6]];
function init(){ac=new (window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
noise=ac.createBufferSource();noise.buffer=b;noise.loop=true;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;ng=ac.createGain();noise.connect(bp).connect(ng).connect(ac.destination);noise.start();
tone=ac.createOscillator();tone.type='triangle';tg=ac.createGain();lfo=ac.createOscillator();lfo.frequency.value=2;const lg=ac.createGain();lg.gain.value=.4;lfo.connect(lg).connect(tg.gain);tone.connect(tg).connect(ac.destination);tone.start();lfo.start()}
function upd(){document.getElementById('nd').style.left=(5+f*90)+'%';document.getElementById('tu').style.transform=`rotate(${f*300}deg)`;let best=S[0],bd=1;S.forEach(s=>{const d=Math.abs(s[0]-f);if(d<bd){bd=d;best=s}});const clr=Math.max(0,1-bd*25);
document.getElementById('st').textContent=on?(clr>.5?best[1]:'~ static ~'):'— OFF —';if(ac){ng.gain.value=on?.05*(1-clr)+.005:0;tg.gain.value=on?.08*clr:0;tone.frequency.value=best[2]*(1+(f-best[0])*.5)}}
document.getElementById('pw').onclick=e=>{if(!ac)init();on=!on;e.target.style.transform=`rotate(${on?120:0}deg)`;document.getElementById('dl').classList.toggle('on',on);upd()};
let d=false,ly;const tu=document.getElementById('tu');tu.onpointerdown=e=>{d=true;ly=e.clientX+(-e.clientY);tu.setPointerCapture(e.pointerId)};tu.onpointermove=e=>{if(!d)return;const v=e.clientX-e.clientY;f=Math.max(0,Math.min(1,f+(v-ly)/400));ly=v;upd()};tu.onpointerup=()=>d=false;
upd();
</script></body></html>
