<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memphis Milano</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>html body{margin:0;min-height:100vh;overflow:hidden;background:#fff4e0;font-family:'Lilita One',cursive;position:relative}
.sq{position:absolute;inset:0;background:radial-gradient(#111 2px,#0000 2.5px) 0 0/22px 22px;opacity:.15}
.s{position:absolute;animation:bob 6s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-20px) rotate(10deg)}}
.z{width:200px;height:40px;background:linear-gradient(135deg,#0000 25%,#ff5c8a 25% 50%,#0000 50% 75%,#ff5c8a 75%) 0 0/40px 40px;top:12%;left:6%}
.tri{width:0;height:0;border-left:70px solid transparent;border-right:70px solid transparent;border-bottom:120px solid #2ec4f1;top:60%;left:10%}
.ci{width:140px;height:140px;border-radius:50%;background:#ffd23f;border:6px solid #111;top:8%;right:12%}
.sq2{width:110px;height:110px;background:repeating-linear-gradient(45deg,#111 0 4px,#0000 4px 14px);top:66%;right:18%;border:6px solid #111}
.sq3{width:120px;height:120px;border:14px solid #7b5cff;border-radius:50%;border-right-color:transparent;border-bottom-color:transparent;top:42%;right:6%}
.wav{top:78%;left:40%;width:240px}
.c{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-size:clamp(60px,15vw,180px);margin:0;line-height:.85;color:#111;text-shadow:6px 6px 0 #ff5c8a,12px 12px 0 #2ec4f1}
p{font-size:clamp(18px,3vw,28px);background:#111;color:#ffd23f;padding:6px 18px;transform:rotate(-3deg);margin-top:26px}</style></head><body>
<div class="sq"></div><div class="s z"></div><div class="s tri" style="animation-delay:-2s"></div><div class="s ci" style="animation-delay:-1s"></div><div class="s sq2" style="animation-delay:-3s"></div><div class="s sq3" style="animation-delay:-4s"></div>
<svg class="s wav" viewBox="0 0 240 40" style="position:absolute"><path d="M0 20 Q15 0 30 20 T60 20 T90 20 T120 20 T150 20 T180 20 T210 20 T240 20" fill="none" stroke="#111" stroke-width="6"/></svg>
<div class="c"><h1>RAD<br>FORM</h1><p>Milano · 1981 · No taste allowed</p></div></body></html>
