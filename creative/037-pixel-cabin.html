<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Cabin</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>html body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1c2c;font-family:'Press Start 2P',monospace;color:#f4f4f4;gap:20px}
canvas{width:min(94vw,120vh);image-rendering:pixelated;box-shadow:0 0 0 6px #333c57,0 0 0 12px #1a1c2c,0 0 0 14px #566c86}button{font:inherit;font-size:11px;background:#ef7d57;color:#1a1c2c;border:0;padding:10px 16px;box-shadow:inset -4px -4px 0 #b13e53;cursor:pointer}</style></head><body>
<canvas id="c" width="160" height="90"></canvas><button id="b">☀ / ☾ TOGGLE</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let night=false,t=0;
const P={sky:['#41a6f6','#73eff7'],skyN:['#1a1c2c','#29366f'],hill:['#38b764','#257179'],hillN:['#1f3d3a','#14262a']};
function rect(c,a,b,w,h){x.fillStyle=c;x.fillRect(a,b,w,h)}
function draw(){const n=night;for(let y=0;y<90;y++){const k=y/60;rect(k<.5?(n?P.skyN[0]:P.sky[0]):(n?P.skyN[1]:P.sky[1]),0,y,160,1)}
if(n){for(let i=0;i<40;i++){const sx=(i*37)%160,sy=(i*23)%45;if((t/20+i)%7>1)rect('#f4f4f4',sx,sy,1,1)}rect('#f4f4f4',130,10,8,8);rect('#29366f',133,9,7,7)}else{rect('#ffcd75',128,8,12,12);rect('#fff8',124+((t/4)%4),12,1,1);for(let i=0;i<3;i++){const cx=((t/6+i*60)%200)-30;rect('#f4f4f4',cx,15+i*8,18,4);rect('#f4f4f4',cx+4,12+i*8,10,3)}}
for(let X=0;X<160;X++){const h=52+Math.sin(X/14)*6+Math.sin(X/5)*2;rect(n?P.hillN[1]:P.hill[1],X,h,1,90)}
for(let X=0;X<160;X++){const h=64+Math.sin(X/20+2)*4;rect(n?P.hillN[0]:P.hill[0],X,h,1,90)}
[[10,50],[22,54],[140,52],[150,56],[118,58]].forEach(([a,b])=>{rect(n?'#0d2020':'#257179',a,b,7,10);rect(n?'#0d2020':'#257179',a+1,b-4,5,4);rect(n?'#0d2020':'#257179',a+2,b-7,3,3);rect('#5d275d',a+3,b+10,1,3)});
rect('#5d275d',60,52,36,18);rect('#b13e53',56,44,44,8);rect('#b13e53',60,40,36,4);rect('#b13e53',64,36,28,4);rect('#333c57',84,30,5,8);
const win=n?'#ffcd75':'#73eff7';rect(win,66,57,8,6);rect(win,82,57,8,6);rect('#5d275d',69,57,1,6);rect('#5d275d',85,57,1,6);rect('#1a1c2c',75,60,6,10);
for(let i=0;i<4;i++){const sy=26-((t/3+i*6)%24),sx=86+Math.sin((t+i*30)/10)*2;rect('#94b0c2'+(n?'88':''),sx,sy,2+(i%2),2)}
if(n){for(let i=0;i<6;i++){const fx=20+((i*53+t/2)%120),fy=66+Math.sin((t+i*40)/12)*6;if((t+i*13)%30<20)rect('#a7f070',fx,fy,1,1)}x.fillStyle='#ffcd7522';x.fillRect(62,63,30,8)}
rect(n?'#2a1a2a':'#a7f070',0,80,160,10);for(let X=0;X<160;X+=3)rect(n?'#1a1c2c':'#38b764',X,79+(X%2),1,2);t++;requestAnimationFrame(draw)}
document.getElementById('b').onclick=()=>night=!night;draw();
</script></body></html>
