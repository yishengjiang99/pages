<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>donut.c</title>
<style>html body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fdf6e3;color:#b58900;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
pre{margin:0;font-size:clamp(7px,1.6vw,14px);line-height:1;font-weight:700;background:linear-gradient(#d33682,#cb4b16,#b58900);-webkit-background-clip:text;background-clip:text;color:transparent}
.c{margin-top:12px;color:#93a1a1;font-size:12px;letter-spacing:.2em}</style></head><body>
<pre id="p"></pre><div class="c">// a = 1.04, b = 0.72 · drag to spin</div>
<script>
const p=document.getElementById('p');let A=1,B=1,va=.04,vb=.02,drag=false,lx,ly;
addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){vb=(e.clientX-lx)*.002;va=(e.clientY-ly)*.002;lx=e.clientX;ly=e.clientY}});
(function f(){const b=[],z=[],w=80,h=40;for(let k=0;k<w*h;k++){b[k]=k%w===w-1?'\n':' ';z[k]=0}const cA=Math.cos(A),sA=Math.sin(A),cB=Math.cos(B),sB=Math.sin(B);
for(let j=0;j<6.28;j+=.07)for(let i=0;i<6.28;i+=.02){const ct=Math.cos(j),st=Math.sin(j),cp=Math.cos(i),sp=Math.sin(i),hh=ct+2,D=1/(sp*hh*sA+st*cA+5),t=sp*hh*cA-st*sA;
const X=0|(w/2+30*D*(cp*hh*cB-t*sB)),Y=0|(h/2+15*D*(cp*hh*sB+t*cB)),o=X+w*Y,N=0|(8*((st*sA-sp*ct*cA)*cB-sp*ct*sA-st*cA-cp*ct*sB));
if(Y<h&&Y>=0&&X>=0&&X<w-1&&D>z[o]){z[o]=D;b[o]='.,-~:;=!*#$@'[N>0?N:0]}}p.textContent=b.join('');A+=va;B+=vb;if(!drag){va+=(.04-va)*.02;vb+=(.02-vb)*.02}document.querySelector('.c').textContent=`// a = ${A.toFixed(2)}, b = ${B.toFixed(2)} · drag to spin`;requestAnimationFrame(f)})();
</script></body></html>
