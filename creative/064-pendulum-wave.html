<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pendulum Wave</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;600&display=swap" rel="stylesheet">
<style>html body{margin:0;overflow:hidden;background:#f7f3ee;font-family:Montserrat,sans-serif}canvas{display:block}
.t{position:fixed;left:30px;bottom:26px;color:#333}.t h1{font-weight:200;margin:0;font-size:clamp(22px,4vw,40px);letter-spacing:.1em}.t p{margin:4px 0;font-size:12px;letter-spacing:.2em;opacity:.6}</style></head><body>
<canvas id="c"></canvas><div class="t"><h1>PENDULUM WAVE</h1><p>15 PENDULA · 60 S CYCLE · CLICK TO RESTART</p></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,t0=performance.now();function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'}rs();addEventListener('resize',rs);addEventListener('pointerdown',()=>t0=performance.now());
const N=15,T=60,cols=['#e63946','#f4a261','#e9c46a','#2a9d8f','#264653'];
(function f(now){const t=(now-t0)/1000;x.clearRect(0,0,W,H);const top=H*.1,cx=W/2;x.fillStyle='#333';x.fillRect(W*.15,top-6,W*.7,6);
for(let i=0;i<N;i++){const osc=51+i,w=2*Math.PI*osc/T,L=H*.25+i*(H*.5/N),th=.45*Math.cos(w*t);const ax=W*.15+(i+.5)*(W*.7/N);
const bx=ax+Math.sin(th)*L*.6,by=top+Math.cos(th)*L;x.strokeStyle='#3336';x.lineWidth=1*devicePixelRatio;x.beginPath();x.moveTo(ax,top);x.lineTo(bx,by);x.stroke();
const r=Math.min(W,H)*.022;x.fillStyle=cols[i%5];x.beginPath();x.arc(bx,by,r,0,7);x.fill();x.fillStyle='#fff6';x.beginPath();x.arc(bx-r*.3,by-r*.3,r*.35,0,7);x.fill()}
requestAnimationFrame(f)})(t0);
</script></body></html>
