<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Holo Rare</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;800&display=swap" rel="stylesheet">
<style>html body{margin:0;height:100vh;display:grid;place-items:center;background:#111 radial-gradient(circle at 50% 40%,#2b2b3a,#0a0a10);font-family:'Exo 2',sans-serif;perspective:900px;overflow:hidden}
.c{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;width:min(70vw,320px);aspect-ratio:63/88;border-radius:18px;position:relative;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .1s;touch-action:none;
background:linear-gradient(160deg,#2c1a4d,#120a24);box-shadow:0 30px 60px #000a,0 0 0 8px #e9c46a,0 0 0 10px #8a6d26;overflow:hidden;color:#fff}
.art{position:absolute;left:8%;right:8%;top:14%;height:46%;border-radius:8px;overflow:hidden;background:radial-gradient(circle at 50% 70%,#ff7a59,#c2185b 40%,#311b92 80%)}
.art:before{content:'';position:absolute;left:50%;bottom:-20%;width:70%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(#ffd166,#ff7a59 60%,#0000 70%)}
.art:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 60%,#0008),repeating-linear-gradient(90deg,#0000 0 30px,#fff1 30px 31px)}
.nm{position:absolute;top:4%;left:8%;right:8%;display:flex;justify-content:space-between;font-weight:800;font-size:clamp(16px,4.5vw,22px)}
.tx{position:absolute;top:63%;left:8%;right:8%;font-size:clamp(11px,3vw,13px);line-height:1.4}.tx b{color:#e9c46a}
.ft{position:absolute;bottom:4%;left:8%;right:8%;font-size:10px;opacity:.6;display:flex;justify-content:space-between}
.holo{position:absolute;inset:0;mix-blend-mode:color-dodge;opacity:.7;background:repeating-linear-gradient(115deg,#ff0080 0%,#ffd000 6%,#00ff9d 12%,#00b7ff 18%,#c300ff 24%,#ff0080 30%);background-size:300% 300%;background-position:var(--mx) var(--my);filter:brightness(.6) contrast(1.4)}
.gl{position:absolute;inset:0;background:radial-gradient(circle at var(--mx) var(--my),#fffc,#fff0 40%);mix-blend-mode:overlay}</style></head><body>
<div class="c" id="c"><div class="art"></div><div class="nm"><span>Solaris Drake</span><span>HP 220</span></div>
<div class="tx"><b>◆ Ability: Eternal Dusk</b><br>Once per turn, set the sun. All opponents' cards become slightly more melancholic.<br><br><b>Flare Breath</b> ......... 180</div>
<div class="ft"><span>Illus. CSS Gradient</span><span>★ 001/100</span></div><div class="holo"></div><div class="gl"></div></div>
<script>
const c=document.getElementById('c');function mv(px,py){const r=c.getBoundingClientRect(),x=(px-r.left)/r.width,y=(py-r.top)/r.height;c.style.setProperty('--ry',(x-.5)*30+'deg');c.style.setProperty('--rx',(.5-y)*30+'deg');c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%')}
addEventListener('pointermove',e=>mv(e.clientX,e.clientY));let t=0;const id=setInterval(()=>{t+=.03;const r=c.getBoundingClientRect();mv(r.left+r.width*(.5+.4*Math.cos(t)),r.top+r.height*(.5+.4*Math.sin(t*1.3)))},30);addEventListener('pointermove',()=>clearInterval(id),{once:true});
</script></body></html>
