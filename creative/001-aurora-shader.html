<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>html,html body{margin:0;height:100%;background:#020611;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}
.t{position:fixed;left:0;right:0;bottom:18vh;text-align:center;color:#d8fff1;font:italic 300 clamp(28px,6vw,72px)/1 'Cormorant Garamond',serif;letter-spacing:.08em;text-shadow:0 0 30px #3fffb0aa;pointer-events:none}
.t small{display:block;font-size:.28em;letter-spacing:.6em;opacity:.6;margin-top:1em}</style></head><body>
<canvas id="c"></canvas><div class="t">Borealis<small>69° N · LIVE SKY</small></div>
<script>
const c=document.getElementById('c'),gl=c.getContext('webgl');
if(!gl){document.body.style.background='linear-gradient(#021,#064,#020611)'}else{
const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}';
const fs=`precision highp float;uniform vec2 r;uniform float t;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p*=2.;a*=.5;}return v;}
void main(){vec2 uv=gl_FragCoord.xy/r;float ar=r.x/r.y;vec2 p=vec2(uv.x*ar,uv.y);
vec3 col=mix(vec3(.0,.01,.04),vec3(.02,.05,.12),uv.y);
for(float i=0.;i<3.;i++){float y=.55+.12*i+.12*sin(p.x*1.3+t*.15+i*2.)+.15*fbm(vec2(p.x*1.5+t*.05,i));
float d=uv.y-y;float band=exp(-abs(d)*(d>0.?6.:28.))*smoothstep(.2,.9,fbm(vec2(p.x*6.+t*.3,t*.1+i)));
vec3 c=mix(vec3(.1,1.,.6),vec3(.6,.2,1.),i/2.+.2*sin(t*.2));col+=c*band*.55;}
float s=step(.996,h(floor(gl_FragCoord.xy/1.5)))*(.5+.5*sin(t*3.+h(gl_FragCoord.xy)*40.));col+=s*smoothstep(.3,.8,uv.y);
float m=.12+.06*sin(p.x*3.)+.04*sin(p.x*9.+1.);if(uv.y<m)col=vec3(.005,.01,.02);
gl_FragColor=vec4(col,1);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
const ur=gl.getUniformLocation(pr,'r'),ut=gl.getUniformLocation(pr,'t');
function rs(){const d=Math.min(devicePixelRatio,1.5);c.width=innerWidth*d;c.height=innerHeight*d;gl.viewport(0,0,c.width,c.height)}addEventListener('resize',rs);rs();
(function f(ms){gl.uniform2f(ur,c.width,c.height);gl.uniform1f(ut,ms/1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(f)})(0);}
</script></body></html>
