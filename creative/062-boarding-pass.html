<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boarding Pass — MOON</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;800&display=swap" rel="stylesheet">
<style>html body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e3a8a);display:grid;place-items:center;font-family:Manrope,sans-serif;padding:20px;box-sizing:border-box}
.bp{display:flex;width:min(94vw,760px);filter:drop-shadow(0 30px 40px #0008)}.m{flex:1;background:#fff;border-radius:18px 0 0 18px;padding:24px;position:relative}.st{width:30%;background:#f4f4f5;border-radius:0 18px 18px 0;padding:24px 18px;border-left:2px dashed #cbd5e1;position:relative}
.m:after,.st:before{content:'';position:absolute;width:26px;height:26px;border-radius:50%;background:#1e3a8a}.m:after{right:-14px;top:-13px;box-shadow:0 calc(100% + 0px) #1e3a8a}.st:before{left:-14px;bottom:-13px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#1e3a8a}.top span{font-size:12px;color:#64748b;letter-spacing:.2em}
.rt{display:flex;align-items:center;justify-content:space-between;margin:22px 0}.ap b{font-size:clamp(36px,8vw,60px);display:block;line-height:1;color:#0f172a}.ap small{color:#64748b;font-size:12px}
.pl{flex:1;margin:0 14px;border-top:2px dashed #cbd5e1;position:relative}.pl i{position:absolute;left:0;top:-14px;font-size:22px;font-style:normal;animation:fly 4s ease-in-out infinite}
@keyframes fly{to{left:calc(100% - 24px)}}.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.gr div{font-size:11px;color:#64748b;letter-spacing:.1em}.gr b{display:block;font-size:18px;color:#0f172a;letter-spacing:0}
.bc{height:60px;margin-top:16px;background:repeating-linear-gradient(90deg,#0f172a 0 2px,#0000 2px 4px,#0f172a 4px 5px,#0000 5px 8px,#0f172a 8px 11px,#0000 11px 12px)}
.st b{display:block;font-size:22px;color:#0f172a}.st div{font-size:11px;color:#64748b;margin-bottom:10px;letter-spacing:.1em}
@media(max-width:560px){.bp{flex-direction:column}.m{border-radius:18px 18px 0 0}.st{width:auto;border-radius:0 0 18px 18px;border-left:0;border-top:2px dashed #cbd5e1}.m:after,.st:before{display:none}}</style></head><body>
<div class="bp"><div class="m"><div class="top">✦ LUNAR AIRWAYS<span>BOARDING PASS · FIRST CLASS</span></div>
<div class="rt"><div class="ap"><b>EAR</b><small>Earth, Cape Canaveral</small></div><div class="pl"><i>🚀</i></div><div class="ap" style="text-align:right"><b>MON</b><small>Moon, Tranquility Base</small></div></div>
<div class="gr"><div>PASSENGER<b>Y. Jiang</b></div><div>FLIGHT<b>LA 2027</b></div><div>GATE<b>∞</b></div><div>SEAT<b>1A</b></div><div>DATE<b>09 NOV</b></div><div>BOARDS<b>T-10:00</b></div><div>DURATION<b>3d 4h</b></div><div>GRAVITY<b>0.165g</b></div></div><div class="bc"></div></div>
<div class="st"><div>PASSENGER</div><b>Y. Jiang</b><div style="margin-top:10px">FROM → TO</div><b>EAR → MON</b><div style="margin-top:10px">SEAT</div><b>1A · Window</b><div style="margin-top:10px">ZONE</div><b>Weightless</b></div></div></body></html>
