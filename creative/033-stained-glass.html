<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stained Glass</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>html body{margin:0;min-height:100vh;background:#15100c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:UnifrakturMaguntia,serif;color:#e8c77a}
.win{width:min(80vw,58vh);aspect-ratio:2/3;border-radius:50% 50% 0 0/33% 33% 0 0;overflow:hidden;border:10px solid #3a2a1a;box-shadow:0 0 80px #ffb34755,inset 0 0 40px #000}
canvas{width:100%;height:100%;display:block;cursor:pointer}h1{margin:0;font-size:clamp(28px,5vw,48px);font-weight:400}p{margin:0;font-family:Georgia,serif;font-size:13px;letter-spacing:.2em;opacity:.7}</style></head><body>
<h1>Rosa Lucis</h1><div class="win"><canvas id="c" width="400" height="600"></canvas></div><p>TAP TO RE-LEAD THE GLASS</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=400,H=600;
function make(){const N=70,P=[];for(let i=0;i<N;i++){const a=Math.random()*6.28,r=Math.random()**.7*300;P.push([200+Math.cos(a)*r*.7,300+Math.sin(a)*r,Math.random()])}
const pal=['#b3122e','#1c3f94','#e3a21a','#1e7a4c','#6b2a8c','#d4581c','#2b8fbf'],img=x.createImageData(W,H),own=new Int16Array(W*H);
for(let y=0;y<H;y++)for(let X=0;X<W;X++){let b=1e9,bi=0,s=1e9;for(let i=0;i<N;i++){const d=(X-P[i][0])**2+(y-P[i][1])**2;if(d<b){s=b;b=d;bi=i}else if(d<s)s=d}
own[y*W+X]=bi;const edge=Math.sqrt(s)-Math.sqrt(b)<3.2;const k=(y*W+X)*4;if(edge){img.data[k]=img.data[k+1]=img.data[k+2]=18}else{const col=pal[bi%pal.length],v=.75+.35*Math.sin(X*.05+y*.03+P[bi][2]*9);
img.data[k]=parseInt(col.slice(1,3),16)*v;img.data[k+1]=parseInt(col.slice(3,5),16)*v;img.data[k+2]=parseInt(col.slice(5,7),16)*v}img.data[k+3]=255}
x.putImageData(img,0,0);const g=x.createRadialGradient(200,220,10,200,300,360);g.addColorStop(0,'#fff6');g.addColorStop(1,'#0006');x.fillStyle=g;x.fillRect(0,0,W,H)}
c.onclick=make;make();
</script></body></html>
