<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLASMA.EXE — demoscene</title>
<style>html body{margin:0;height:100vh;overflow:hidden;background:#000}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.sc{position:fixed;bottom:12vh;left:0;white-space:nowrap;font:900 clamp(30px,7vw,80px) 'Courier New',monospace;color:#fff;text-shadow:4px 4px 0 #000}
.sc span{display:inline-block}.cr{position:fixed;top:3vh;width:100%;text-align:center;font:700 14px 'Courier New',monospace;color:#fff;letter-spacing:.5em;text-shadow:2px 2px 0 #000}</style></head><body>
<canvas id="c"></canvas><div class="cr">*** FAIRLIGHT-ISH PRESENTS ***</div><div class="sc" id="s"></div>
<script>
const c=document.getElementById('c'),gl=c.getContext('webgl');
const fs=`precision mediump float;uniform float t;uniform vec2 r;void main(){vec2 p=floor(gl_FragCoord.xy/4.)*4./r.y;float v=sin(p.x*10.+t)+sin(10.*(p.x*sin(t/2.)+p.y*cos(t/3.))+t)+sin(sqrt(100.*((p.x-.5+.5*sin(t/5.))*(p.x-.5+.5*sin(t/5.))+(p.y-.5+.5*cos(t/3.))*(p.y-.5+.5*cos(t/3.)))+1.)+t);
vec3 col=vec3(sin(v*3.14159),sin(v*3.14159+2.094),sin(v*3.14159+4.188))*.5+.5;col=floor(col*6.)/6.;gl_FragColor=vec4(col,1);}`;
if(gl){const sh=(ty,src)=>{const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);return s};const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}'));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const ut=gl.getUniformLocation(pr,'t'),ur=gl.getUniformLocation(pr,'r');const rs=()=>{c.width=innerWidth;c.height=innerHeight;gl.viewport(0,0,c.width,c.height)};rs();addEventListener('resize',rs);
(function f(ms){gl.uniform1f(ut,ms/1000);gl.uniform2f(ur,c.width,c.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(f)})(0)}
const msg='   GREETINGS TO ALL CODERS, SWAPPERS AND TRACKERS · NO FRAMEWORKS WERE HARMED · THIS PLASMA RUNS AT 60 FPS ON YOUR TOASTER · HELLO 1992 · KEEP THE SCENE ALIVE ·   ',s=document.getElementById('s');
[...msg].forEach(ch=>{const e=document.createElement('span');e.textContent=ch===' '?'\u00a0':ch;s.appendChild(e)});const L=[...s.children];
(function f(ms){const t=ms/1000,w=s.scrollWidth;s.style.transform=`translateX(${innerWidth-((t*220)%(w+innerWidth))}px)`;L.forEach((e,i)=>{e.style.transform=`translateY(${Math.sin(t*4+i*.35)*24}px)`;e.style.color=`hsl(${(i*12+t*120)%360},100%,70%)`});requestAnimationFrame(f)})(0);
</script></body></html>
