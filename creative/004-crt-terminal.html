<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-1983</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>html body{margin:0;background:#0b0f0b;min-height:100vh;display:grid;place-items:center;font-family:VT323,monospace}
.s{width:min(92vw,900px);height:min(78vh,640px);border-radius:28px/22px;background:radial-gradient(ellipse at center,#062b10 0%,#020c04 80%);box-shadow:0 0 0 16px #2b2a26,0 0 0 20px #111,0 30px 80px #000,inset 0 0 90px #000;position:relative;overflow:hidden;padding:30px;box-sizing:border-box;color:#5bff7a;font-size:clamp(16px,2.5vw,24px);text-shadow:0 0 6px #3f6,0 0 14px #1a5;animation:fl .12s infinite}
.s:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(#0000 0 2px,#0006 2px 4px);pointer-events:none;z-index:2}
.s:after{content:'';position:absolute;inset:0;background:linear-gradient(#5f71,#0000 10%);animation:sc 6s linear infinite;pointer-events:none}
@keyframes sc{from{transform:translateY(-100%)}to{transform:translateY(100%)}}@keyframes fl{50%{opacity:.97}}
#o{white-space:pre-wrap;margin:0;height:100%;overflow:auto}.cur{display:inline-block;width:.6em;height:1em;background:#5bff7a;vertical-align:-2px;animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
input{position:absolute;opacity:0;pointer-events:none}</style></head><body>
<div class="s" onclick="i.focus()"><pre id="o"></pre></div><input id="i" autocomplete="off">
<script>
const o=document.getElementById('o'),i=document.getElementById('i');let buf='',typing=true;
const boot=["ROBCO INDUSTRIES (TM) TERMLINK","","CHECKING MEMORY........ 64K OK","LOADING KERNEL......... OK","MOUNTING /dev/dreams.... OK","",">> WELCOME, OPERATOR.",">> TYPE 'help' AND PRESS ENTER.",""];
const cmds={help:"commands: help, date, whoami, fortune, clear, matrix",date:()=>new Date().toString().toUpperCase(),whoami:"guest@vt1983 — clearance: none",
fortune:()=>["THE NUMBER YOU HAVE DIALED IS IMAGINARY.","ALL YOUR BASE ARE BELONG TO CSS.","THERE IS NO CLOUD. ONLY OTHER PEOPLE'S COMPUTERS.","SHALL WE PLAY A GAME?"][Math.random()*4|0],
matrix:()=>Array.from({length:8},()=>Array.from({length:40},()=>Math.random()<.5?'0':'1').join('')).join('\n')};
function render(){o.innerHTML=buf.replace(/</g,'&lt;')+'<span class="cur"></span>';o.scrollTop=1e9}
async function type(t){for(const ch of t){buf+=ch;render();await new Promise(r=>setTimeout(r,12+Math.random()*25))}}
(async()=>{for(const l of boot)await type(l+'\n');buf+='> ';typing=false;render();i.focus()})();
i.addEventListener('keydown',async e=>{if(typing)return;if(e.key==='Enter'){const line=buf.split('> ').pop().trim();buf+='\n';typing=true;
if(line==='clear')buf='';else if(line){const r=cmds[line.toLowerCase()];await type((r?(typeof r==='function'?r():r):"SYNTAX ERROR: '"+line+"'")+'\n')}
buf+='> ';typing=false;render();i.value=''}else if(e.key==='Backspace'){if(!buf.endsWith('> '))buf=buf.slice(0,-1);render()}else if(e.key.length===1){buf+=e.key.toUpperCase()===e.key?e.key:e.key;render()}});
</script></body></html>
