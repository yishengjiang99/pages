<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Eyes Are Lying</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;1,200&display=swap" rel="stylesheet">
<style>html body{margin:0;min-height:100vh;background:#ecebe4;font-family:Spectral,serif;color:#222;padding:5vh 4vw;box-sizing:border-box}
h1{font-weight:200;font-size:clamp(32px,6vw,64px);margin:0 0 4vh;text-align:center}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4vw;max-width:1100px;margin:auto}
.p{display:flex;flex-direction:column;gap:12px}.box{aspect-ratio:1;overflow:hidden;box-shadow:0 10px 30px #0002;position:relative}.p b{font-weight:200;font-size:24px}.p i{opacity:.7}
.cafe{display:flex;flex-direction:column;background:#888;gap:2px}.cafe div{flex:1;background:repeating-linear-gradient(90deg,#111 0 30px,#fff 30px 60px)}
.cafe div:nth-child(4n+2){background-position:10px 0}.cafe div:nth-child(4n+3){background-position:20px 0}.cafe div:nth-child(4n+4){background-position:10px 0}
.herm{background:#111;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px}.herm i{background:#111;outline:8px solid #111;box-shadow:0 0 0 8px #fff}
.herm2{background:#fff;display:grid;grid-template-columns:repeat(6,1fr);gap:9px;padding:9px;box-sizing:border-box}.herm2 i{background:#111;position:relative}
.herm2 i:after{content:'';position:absolute;right:-7px;bottom:-7px;width:5px;height:5px;border-radius:50%;background:#fff;z-index:1}
.tb{background-color:#e04e4e;--s:50px;background-image:linear-gradient(30deg,#f2b33d 12%,#0000 12.5% 87%,#f2b33d 87.5%),linear-gradient(150deg,#f2b33d 12%,#0000 12.5% 87%,#f2b33d 87.5%),linear-gradient(30deg,#f2b33d 12%,#0000 12.5% 87%,#f2b33d 87.5%),linear-gradient(150deg,#f2b33d 12%,#0000 12.5% 87%,#f2b33d 87.5%),linear-gradient(60deg,#3d7ff2 25%,#0000 25.5% 75%,#3d7ff2 75%),linear-gradient(60deg,#3d7ff2 25%,#0000 25.5% 75%,#3d7ff2 75%);
background-size:var(--s) calc(var(--s)*1.732);background-position:0 0,0 0,calc(var(--s)/2) calc(var(--s)*.866),calc(var(--s)/2) calc(var(--s)*.866),0 0,calc(var(--s)/2) calc(var(--s)*.866)}
.rot{background:repeating-conic-gradient(#222 0 10deg,#ecebe4 10deg 20deg);border-radius:50%;animation:none}.rot:after{content:'';position:absolute;inset:35%;border-radius:50%;background:radial-gradient(#e04e4e,#e04e4e 60%,#0000 62%)}
.rot:before{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle,#0000 0 14px,#ecebe455 14px 18px);border-radius:50%}</style></head><body>
<h1>Your Eyes Are Lying</h1><div class="g">
<div class="p"><div class="box cafe" id="cafe"></div><b>Café Wall</b><i>Every grey line is perfectly horizontal. Honest.</i></div>
<div class="p"><div class="box" id="herm" style="background:#000"></div><b>Scintillating Grid</b><i>The white dots are white. The black dots you see are not there.</i></div>
<div class="p"><div class="box tb"></div><b>Tumbling Blocks</b><i>Stare long enough and the cubes flip inside out.</i></div>
<div class="p"><div class="box rot" id="rot"></div><b>Ouchi Spin</b><i>Move your head slightly. The disc drifts. It doesn't.</i></div></div>
<script>const cf=document.getElementById('cafe');for(let i=0;i<10;i++)cf.appendChild(document.createElement('div'));let sv='<svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block"><rect width="100" height="100" fill="#000"/>';for(let i=1;i<10;i++){sv+=`<line x1="${i*10}" y1="0" x2="${i*10}" y2="100" stroke="#777" stroke-width="1.6"/><line y1="${i*10}" x1="0" y2="${i*10}" x2="100" stroke="#777" stroke-width="1.6"/>`}for(let i=1;i<10;i++)for(let j=1;j<10;j++)sv+=`<circle cx="${i*10}" cy="${j*10}" r="1.5" fill="#fff"/>`;document.getElementById('herm').innerHTML=sv+'</svg>';</script></body></html>
