<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Letter</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>html body{margin:0;min-height:100vh;background:#5a4636 repeating-linear-gradient(90deg,#5a4636 0 40px,#55412f 40px 80px);padding:6vh 4vw;box-sizing:border-box;font-family:'Special Elite',monospace}
.p{max-width:640px;margin:auto;background:#fbf6e9;padding:60px 56px;box-shadow:0 30px 60px #0007;position:relative;transform:rotate(-.8deg);color:#2b2620;font-size:17px;line-height:1.75;min-height:70vh}
.p:before{content:'';position:absolute;right:40px;top:60%;width:130px;height:130px;border-radius:50%;border:12px solid #8b5a2b22;box-shadow:inset 0 0 20px #8b5a2b22;filter:blur(1px)}
#t{white-space:pre-wrap}.c{display:inline-block;width:2px;height:1em;background:#2b2620;animation:b .8s steps(1) infinite;vertical-align:-2px}@keyframes b{50%{opacity:0}}
.sig{font:28px 'Homemade Apple',cursive;color:#1d3c7a;opacity:0;transition:opacity 2s;margin-top:20px}.dt{text-align:right;margin-bottom:30px}</style></head><body>
<div class="p"><div class="dt">Lisbon, the 9th of November</div><span id="t"></span><span class="c"></span><div class="sig" id="s">— Ines</div></div>
<script>
const msg=`Dear Theo,

The typewriter you left here still sticks on the letter "e", so forgive me if this reads like someone hiccuping through a confession.

The tram outside rattles the windows every eleven minutes. I've started timing my thoughts by it. One tram for missing you. One tram for being glad you left, because now there is room on the balcony for the lemon tree.

Write back on paper. Emails don't smell of anything.

Yours, in ink and slight annoyance,`;
const t=document.getElementById('t');let i=0;
(function k(){if(i<msg.length){t.textContent+=msg[i];const ch=msg[i++];setTimeout(k,ch==='\n'?260:ch==='.'||ch===','?140:28+Math.random()*60)}else document.getElementById('s').style.opacity=1})();
</script></body></html>
