<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Keeper</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital@1&display=swap" rel="stylesheet">
<style>html body{margin:0;height:100vh;overflow:hidden;background:linear-gradient(#050b1f,#122447 60%,#1b335c);font-family:'Libre Caslon Text',serif}
.st{position:fixed;inset:0;background-image:radial-gradient(1px 1px at 10% 20%,#fff,#0000),radial-gradient(1px 1px at 30% 10%,#fff,#0000),radial-gradient(1px 1px at 50% 25%,#fffa,#0000),radial-gradient(1.5px 1.5px at 70% 15%,#fff,#0000),radial-gradient(1px 1px at 90% 30%,#fff,#0000),radial-gradient(1px 1px at 15% 40%,#fff8,#0000),radial-gradient(1px 1px at 82% 8%,#fff,#0000)}
.beam{position:fixed;left:72vw;top:calc(100vh - 62vh);width:200vmax;height:16vh;margin-top:-8vh;transform-origin:0 50%;background:linear-gradient(90deg,#fff6c8cc,#fff6c800 70%);clip-path:polygon(0 45%,100% 0,100% 100%,0 55%);animation:sw 8s linear infinite;mix-blend-mode:screen;filter:blur(2px)}
.beam.b2{animation-delay:-4s}@keyframes sw{0%{transform:rotate(0deg) scaleY(1)}25%{transform:rotate(90deg) scaleY(.1)}50%{transform:rotate(180deg) scaleY(1)}75%{transform:rotate(270deg) scaleY(.1)}100%{transform:rotate(360deg) scaleY(1)}}
.lh{position:fixed;left:calc(72vw - 3.5vh);bottom:22vh;width:7vh;height:36vh;background:repeating-linear-gradient(#e8e8e8 0 6vh,#b3261e 6vh 12vh);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.top{position:fixed;left:calc(72vw - 3vh);bottom:58vh;width:6vh;height:5vh;background:#222;border-radius:3vh 3vh 0 0}.lamp{position:fixed;left:calc(72vw - 1.6vh);bottom:58.5vh;width:3.2vh;height:3.2vh;border-radius:50%;background:#fff6c8;box-shadow:0 0 30px 10px #fff6c8}
.rock{position:fixed;left:55vw;right:0;bottom:16vh;height:9vh;background:#0a0f1c;border-radius:60% 40% 0 0}
.sea{position:fixed;left:0;right:0;bottom:0;height:22vh;background:linear-gradient(#0c1a33,#050b1f);overflow:hidden}.sea i{position:absolute;left:-10%;width:120%;height:2px;background:#ffffff18;animation:wv 6s ease-in-out infinite alternate}
@keyframes wv{to{transform:translateX(5%)}}.q{position:fixed;left:7vw;top:16vh;color:#e6ecff;font-style:italic;font-size:clamp(20px,3.4vw,38px);max-width:14em;line-height:1.35;z-index:3}.q small{display:block;font-size:.4em;letter-spacing:.3em;font-style:normal;margin-top:16px;opacity:.6}</style></head><body>
<div class="st"></div><div class="beam"></div><div class="beam b2"></div><div class="q">Somewhere tonight, someone is keeping a light on for a ship they will never meet.<small>THE KEEPER · 1897</small></div>
<div class="rock"></div><div class="lh"></div><div class="top"></div><div class="lamp"></div><div class="sea" id="sea"></div>
<script>const s=document.getElementById('sea');for(let i=0;i<14;i++){const w=document.createElement('i');w.style.top=(i*7+3)+'%';w.style.animationDelay=(-i*.7)+'s';w.style.opacity=1-i/16;s.appendChild(w)}</script></body></html>
