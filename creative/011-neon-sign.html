<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Late</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Yellowtail&display=swap" rel="stylesheet">
<style>html body{margin:0;height:100vh;display:grid;place-items:center;overflow:hidden;background:#1a0f0d;
background-image:linear-gradient(#0000 47px,#0007 47px 50px),linear-gradient(90deg,#0000 97px,#0007 97px 100px),linear-gradient(#3a1d16,#24120e);background-size:100px 50px,100px 100px,auto}
html body:before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#ff2d9533,#0000 60%)}
.s{text-align:center;position:relative}
.a{font:clamp(48px,12vw,150px) Monoton,cursive;color:#ffe6f4;text-shadow:0 0 5px #fff,0 0 12px #ff2d95,0 0 28px #ff2d95,0 0 60px #ff2d95,0 0 100px #ff2d95}
.a span:nth-child(3){animation:fl 4s infinite}
.b{font:clamp(36px,8vw,90px) Yellowtail,cursive;color:#e7fbff;margin-top:-.2em;text-shadow:0 0 5px #fff,0 0 12px #0ff,0 0 30px #0cf,0 0 70px #0cf;transform:rotate(-6deg)}
@keyframes fl{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.15;text-shadow:none}}
.w{position:absolute;left:50%;top:-50vh;height:50vh;width:2px;background:#111;box-shadow:-120px 0 0 #111,120px 0 0 #111}
.off .a,.off .b{color:#3b2a33;text-shadow:none}.h{position:fixed;bottom:20px;width:100%;text-align:center;color:#a77;font:12px monospace;letter-spacing:.3em}</style></head><body>
<div class="s" id="s" onclick="this.classList.toggle('off')"><div class="w"></div><div class="a"><span>O</span><span>P</span><span>E</span><span>N</span></div><div class="b">all night long</div></div><div class="h">CLICK THE SIGN</div></body></html>
