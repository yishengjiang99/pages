<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karesansui</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300&display=swap" rel="stylesheet">
<style>html body{margin:0;overflow:hidden;background:#d9d0bd;font-family:'Noto Serif JP',serif;touch-action:none}canvas{display:block;cursor:crosshair}
.t{position:fixed;top:24px;left:28px;color:#5c5446;font-size:14px;letter-spacing:.4em;writing-mode:vertical-rl;pointer-events:none}</style></head><body>
<canvas id="c"></canvas><div class="t">石庭 · DRAG TO RAKE</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,R=[],last=null;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;R=[[W*.3,H*.4,Math.min(W,H)*.08],[W*.68,H*.62,Math.min(W,H)*.06],[W*.75,H*.3,Math.min(W,H)*.035]];x.fillStyle='#e6dfcf';x.fillRect(0,0,W,H);
for(let y=10;y<H;y+=10){x.strokeStyle='#c9bfa966';x.lineWidth=2;x.beginPath();for(let X=0;X<W;X+=8){let yy=y;for(const r of R){const d=Math.hypot(X-r[0],y-r[1]);if(d<r[2]*3)yy+=Math.sin((d-r[2])/10)*0}X?x.lineTo(X,yy):x.moveTo(X,yy)}x.stroke()}
for(const r of R){for(let k=1;k<6;k++){x.strokeStyle='#bfb49c';x.lineWidth=2;x.beginPath();x.ellipse(r[0],r[1],r[2]+k*11,(r[2]+k*11)*.8,0,0,7);x.stroke()}}drawRocks()}
function drawRocks(){for(const r of R){const g=x.createRadialGradient(r[0]-r[2]*.3,r[1]-r[2]*.4,r[2]*.1,r[0],r[1],r[2]);g.addColorStop(0,'#8a857c');g.addColorStop(1,'#3e3b37');x.fillStyle='#0002';x.beginPath();x.ellipse(r[0]+6,r[1]+8,r[2],r[2]*.8,0,0,7);x.fill();x.fillStyle=g;x.beginPath();x.ellipse(r[0],r[1],r[2],r[2]*.8,0,0,7);x.fill();
x.fillStyle='#5f7a4a88';x.beginPath();x.ellipse(r[0]-r[2]*.2,r[1]-r[2]*.5,r[2]*.4,r[2]*.15,-.3,0,7);x.fill()}}
function rake(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);if(L<1)return;const nx=-dy/L,ny=dx/L;for(let k=-3;k<=3;k++){const o=k*7;x.strokeStyle='#e9e2d3';x.lineWidth=5;x.beginPath();x.moveTo(a[0]+nx*o,a[1]+ny*o);x.lineTo(b[0]+nx*o,b[1]+ny*o);x.stroke();
x.strokeStyle='#b8ad94';x.lineWidth=1.5;x.beginPath();x.moveTo(a[0]+nx*(o+2.5),a[1]+ny*(o+2.5));x.lineTo(b[0]+nx*(o+2.5),b[1]+ny*(o+2.5));x.stroke()}drawRocks()}
rs();addEventListener('resize',rs);c.addEventListener('pointerdown',e=>last=[e.clientX,e.clientY]);addEventListener('pointerup',()=>last=null);
c.addEventListener('pointermove',e=>{if(!last)return;const p=[e.clientX,e.clientY];rake(last,p);last=p});
</script></body></html>
