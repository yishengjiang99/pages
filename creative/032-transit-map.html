<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metro of Ideas</title>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;800&display=swap" rel="stylesheet">
<style>html body{margin:0;min-height:100vh;background:#fff;font-family:Overpass,sans-serif;color:#111}
.top{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:6px solid #111}.lg{width:44px;height:44px;border-radius:50%;background:#e1251b;display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;border:4px solid #111}
h1{margin:0;font-size:clamp(20px,4vw,34px);font-weight:800}svg{width:100%;height:auto;display:block;max-width:1100px;margin:auto}
.st{cursor:pointer}.st:hover circle{r:11}text{font-family:Overpass,sans-serif;font-size:14px;font-weight:800}
.key{display:flex;flex-wrap:wrap;gap:18px;padding:0 24px 24px;font-size:14px;font-weight:800;justify-content:center}.key i{display:inline-block;width:28px;height:7px;border-radius:4px;margin-right:6px;vertical-align:middle}</style></head><body>
<div class="top"><div class="lg">M</div><h1>Metro of Ideas · Network Map</h1></div>
<svg viewBox="0 0 1000 620" fill="none" stroke-linecap="round" stroke-linejoin="round" id="s">
<path d="M60 120 H300 L400 220 H620 L720 120 H940" stroke="#e1251b" stroke-width="12"/>
<path d="M120 560 V420 L240 300 H400 L500 400 H760 L860 500 V560" stroke="#0067b1" stroke-width="12"/>
<path d="M500 40 V220 L500 400 V580" stroke="#00a651" stroke-width="12"/>
<path d="M60 300 H240 M400 300 L500 220 L620 340 H940" stroke="#f7a800" stroke-width="12"/>
<path d="M300 120 V40 M720 120 L820 220 V340" stroke="#8e44ad" stroke-width="12"/></svg>
<div id="tip" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:24px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none">Tap a station</div><div class="key"><span><i style="background:#e1251b"></i>Curiosity Line</span><span><i style="background:#0067b1"></i>Doubt Line</span><span><i style="background:#00a651"></i>Coffee Express</span><span><i style="background:#f7a800"></i>Tangent Circle</span><span><i style="background:#8e44ad"></i>Shower Thought Spur</span></div>
<script>
const st=[[60,120,'Blank Page',0,-1],[180,120,'What If',0,-1],[300,120,'Hmm',-1,-1],[400,220,'Rabbit Hole',-1,1],[500,220,'Eureka Central',1,-1,1],[620,220,'Sketchbook',0,1],[720,120,'Prototype',1,-1],[840,120,'Pivot',0,-1],[940,120,'Shipped',0,1],
[120,560,'Impostor Syndrome',1,0],[120,420,'Overthinking',1,0],[240,300,'Second Guess',0,1,1],[400,300,'Feedback',0,1],[500,400,'Midnight Oil',1,1,1],[760,400,'Iteration',0,-1],[860,500,'Good Enough',1,0],[860,560,'Done',1,0],
[500,40,'Espresso',1,0],[500,580,'Nap Junction',1,0],[60,300,'Daydream',0,-1],[620,340,'Wikipedia',0,1],[780,340,'Tangent',0,1],[940,340,'Lost',0,-1],[300,40,'Shower',1,0],[820,220,'Sudden Clarity',1,0]];
const s=document.getElementById('s');st.forEach(([x,y,n,dx,dy,ic])=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','st');
g.innerHTML=ic?`<rect x="${x-14}" y="${y-14}" width="28" height="28" rx="14" fill="#fff" stroke="#111" stroke-width="5"/>`:`<circle cx="${x}" cy="${y}" r="8" fill="#fff" stroke="#111" stroke-width="4"/>`;
const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.textContent=n;t.setAttribute('fill','#111');t.setAttribute('x',x+dx*18);t.setAttribute('y',y+(dy>0?32:dy<0?-20:5));t.setAttribute('text-anchor',dx>0?'start':dx<0?'end':'middle');g.appendChild(t);
g.onclick=()=>{const b=document.getElementById('tip');b.textContent='Next train to '+n+': '+(1+Math.random()*9|0)+' min';b.style.opacity=1;clearTimeout(b.t);b.t=setTimeout(()=>b.style.opacity=0,2200)};s.appendChild(g)});
</script></body></html>
